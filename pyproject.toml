[project]
name = "omrate-agentops"
version = "0.0.0"
description = "OmRate validation orchestration control plane (manifests, rules, reports)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts", "validators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
